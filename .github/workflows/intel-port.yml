name: Intel GuC and GGTT source rebuild
on:
  push:
    branches: [graphics-firmware-build, graphics-startup-b2, graphics-startup-b3, graphics-startup-b4]
    paths: ['research/intel-port/**', '.github/workflows/intel-port.yml']
  workflow_dispatch:
    inputs:
      scripts_only:
        description: 'Validate diagnostics scripts without relinking the unchanged driver'
        type: boolean
        default: false
      reuse_run:
        description: 'Optional prior full source-build run; source hashes must still match'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: intel-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 research/intel-port/tools/test-intel-bridge.py
      - name: Test attach worker lifecycle and cancellation
        run: python3 research/intel-port/tools/test-attach-lifecycle.py
      - name: Check the guarded Mac installer syntax
        run: |
          bash -n research/intel-port/tools/apply-source-fix.sh
          bash -n research/intel-port/tools/boot-recorder.sh
          bash -n research/intel-port/tools/install-boot-recorder.sh
          bash -n research/intel-port/tools/collect-intel-failure.sh
          bash -n research/intel-port/tools/apply-worker-checkpoint.sh
          bash -n research/intel-port/tools/apply-recorded-test.sh
          bash -n research/intel-port/tools/apply-claim-gate.sh
          bash -n research/intel-port/tools/apply-claim-gate-test.sh
          bash -n research/intel-port/tools/apply-B2.sh
          bash -n research/intel-port/tools/apply-B2-test.sh
          bash -n research/intel-port/tools/apply-B3.sh
          bash -n research/intel-port/tools/apply-B3-test.sh
      - name: Test recorder timeout and capture ordering
        run: python3 research/intel-port/tools/test-boot-recorder.py
  macos-rebuild:
    if: inputs.scripts_only != true
    needs: host-tests
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      REUSE_RUN: ${{ inputs.reuse_run || (github.ref_name == 'graphics-startup-b4' && '39056634863') || (github.ref_name == 'graphics-startup-b3' && '39053708945') || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify pinned sources
        run: python3 research/intel-port/tools/fetch-intel-build-inputs.py
      - name: Generate source overlay
        run: python3 research/intel-port/tools/prepare-intel-bridge-overlay.py
      - name: Compile changed components against real headers
        if: env.REUSE_RUN == ''
        shell: bash
        run: |
          set -euo pipefail
          for source in nmx_i915_bridge.c nmx_fb_bridge.c nmx_kext.cpp layout-probe.c; do
            python3 research/intel-port/tools/compile-intel-bridge.py "$source"
          done
      - name: Rebuild i915 and the DRM port runtime
        if: env.REUSE_RUN == ''
        run: |
          python3 research/intel-port/tools/compile-intel-driver.py
          python3 research/intel-port/tools/compile-intel-runtime.py
      - name: Reuse compiled objects with source-hash validation at link
        if: env.REUSE_RUN != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.REUSE_RUN }}
          pattern: Intel-port-source-build-*
          path: research/intel-port/evidence/
          merge-multiple: true
      - name: Recompile changed runtime sources after artifact reuse
        if: env.REUSE_RUN != ''
        run: python3 research/intel-port/tools/compile-intel-runtime.py --retry-failed
      - name: Link and inspect experimental Intel-only kext
        env:
          SOURCE_BUILD_RUN: ${{ github.run_id }}
        run: python3 research/intel-port/tools/link-intel-port.py
      - name: Preserve build logs and any linked artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Intel-port-source-build-${{ github.sha }}
          path: research/intel-port/evidence/
          if-no-files-found: warn
          retention-days: 14
