name: build-kext

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          xcrun --sdk macosx --show-sdk-path
          clang++ --version
          which make
      - name: Build kext
        run: make
      - name: Package artifact
        run: ditto -c -k --sequesterRsrc --keepParent CoreUltraGraphics.kext CoreUltraGraphics-v0.1.0-kext.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreUltraGraphics-v0.1.0-kext
          path: CoreUltraGraphics-v0.1.0-kext.zip
