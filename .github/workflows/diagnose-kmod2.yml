name: diagnose-kmod2

on:
  workflow_dispatch:
  push:
    branches: [diagnose-kmod2]

jobs:
  diagnose:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select developer directory
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fetch MacKernelSDK at pinned revision
        env:
          MKS_SHA: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
        run: |
          set -e
          mkdir -p /tmp/mks
          curl -sSL "https://codeload.github.com/acidanthera/MacKernelSDK/tar.gz/${MKS_SHA}" \
            | tar -xz -C /tmp/mks --strip-components=1
          echo "fetched:"; ls /tmp/mks
          echo "=== licence files present? ==="
          find /tmp/mks -maxdepth 1 -iname '*licen*' -o -maxdepth 1 -iname '*copying*' | sed 's/^/  /'

      - name: Scan MacKernelSDK archives for _kmod_info
        run: |
          for a in /tmp/mks/Library/x86_64/libkmod.a /tmp/mks/Library/universal/libkmod.a /tmp/mks/Library/universal/libkmodc++.a; do
            echo "=== $a ==="
            if [ -f "$a" ]; then
              echo "  members:"; ar t "$a" 2>/dev/null | sed 's/^/    /'
              echo "  defines _kmod_info?"; nm --defined-only "$a" 2>/dev/null | grep -c '_kmod_info' || true
              nm --defined-only "$a" 2>/dev/null | grep '_kmod_info' | sed 's/^/    /' || echo "    (no _kmod_info)"
            else
              echo "  (not present)"
            fi
          done

      - name: Scan Xcode SDK archives for _kmod_info (control)
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          for a in "$SDK"/usr/lib/libkmod.a "$SDK"/usr/lib/libkmodc++.a; do
            echo "=== $a ==="
            ar t "$a" 2>/dev/null | sed 's/^/    member: /'
            nm --defined-only "$a" 2>/dev/null | grep '_kmod_info' | sed 's/^/    /' || echo "    (no _kmod_info)"
          done

      - name: Build objects
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p build
          for f in CoreUltraGraphicsDriver XeTranslationPipeline; do
            clang++ -m64 -arch x86_64 -std=gnu++14 -fno-builtin -fno-exceptions -fno-rtti \
              -nostdinc -DKERNEL -DAPPLE -DNeXT -Wall -Wextra -O2 -mkernel -fapple-kext \
              -Wno-deprecated-declarations -isysroot "$SDK" \
              -isystem "$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
              -c "$f.cpp" -o "build/$f.o"
          done
          echo ok

      - name: Link with MacKernelSDK archives
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          OBJS="build/CoreUltraGraphicsDriver.o build/XeTranslationPipeline.o"

          try() {
            local label="$1"; shift
            rm -f build/t.out
            if clang++ "$@" -o build/t.out >/dev/null 2>"build/t.err"; then
              nm --defined-only build/t.out 2>/dev/null | grep -q '_kmod_info' \
                && echo "RESULT | $label | KMOD_INFO=YES" \
                || echo "RESULT | $label | KMOD_INFO=no"
              otool -l build/t.out 2>/dev/null | tr -s ' \t' '\n' | grep -q '^__DATA,__data$' \
                && echo "         sections: has __DATA,__data" \
                || echo "         sections: NO __DATA,__data"
            else
              echo "RESULT | $label | LINK FAILED"
              head -4 build/t.err | sed 's/^/         /'
            fi
          }

          try "I MacKernelSDK x86_64 libkmod only" \
              -arch x86_64 -isysroot "$SDK" -mkernel -fapple-kext -static -nostdlib \
              -Xlinker -kext -Xlinker -no_deduplicate \
              "$OBJS" -L/tmp/mks/Library/x86_64 -lkmodc++ -lkmod -lcc_kext

          try "J MacKernelSDK universal libkmod+libkmodc++" \
              -arch x86_64 -isysroot "$SDK" -mkernel -fapple-kext -static -nostdlib \
              -Xlinker -kext -Xlinker -no_deduplicate \
              "$OBJS" -L/tmp/mks/Library/universal -lkmodc++ -lkmod -lcc_kext

          try "K MacKernelSDK headers + universal libs" \
              -arch x86_64 -isysroot "$SDK" -mkernel -fapple-kext -static -nostdlib \
              -nostdinc -I/tmp/mks/Headers \
              -Xlinker -kext -Xlinker -no_deduplicate \
              "$OBJS" -L/tmp/mks/Library/universal -lkmodc++ -lkmod -lcc_kext
